services:
  # ============================================================================
  # Backend API Server
  # ============================================================================
  backend:
    image: ghcr.io/alaminislam34/iformat-website/backend:${IMAGE_TAG:-latest}
    container_name: iformat-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      API_VERSION: v1
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://iformatbranding.com,https://www.iformatbranding.com,https://api.iformatbranding.com}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.iformatbranding.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-https://ai.bloodaidbd.com}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-60000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://api.iformatbranding.com/api/v1/oauth/google/callback}
      OAUTH_SUCCESS_REDIRECT_URL: ${OAUTH_SUCCESS_REDIRECT_URL:-https://iformatbranding.com/account-type}
      OAUTH_FAILURE_REDIRECT_URL: ${OAUTH_FAILURE_REDIRECT_URL:-https://iformatbranding.com/login?error=oauth_failed}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET}
      PRODUCT_ID: ${PRODUCT_ID}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER}
      STRIPE_PRODUCT_STARTER: ${STRIPE_PRODUCT_STARTER}
      STRIPE_PRICE_GROW: ${STRIPE_PRICE_GROW}
      STRIPE_PRODUCT_GROW: ${STRIPE_PRODUCT_GROW}
      STRIPE_PRICE_PROFESSIONAL: ${STRIPE_PRICE_PROFESSIONAL}
      STRIPE_PRODUCT_PROFESSIONAL: ${STRIPE_PRODUCT_PROFESSIONAL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-ifromat-media-db}
      SMTP_HOST: ${SMTP_HOST:-q84n3pze5dfb.zevm.mail-manager-smtp.amazonaws.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER must be set in .env}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS must be set in .env}
      SMTP_FROM: ${SMTP_FROM:-iFormat <info@iformatbranding.com>}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-info@iformatbranding.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-mock-key}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-devamin.bd@gmail.com}
    # Database is AWS RDS (DATABASE_URL); no local database or cache container
    ports:
      # Localhost only: public traffic must go through host nginx (SSL)
      - "127.0.0.1:5000:5000"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - iformat-internal

  # ============================================================================
  # Frontend Application
  # ============================================================================
  frontend:
    image: ghcr.io/alaminislam34/iformat-website/frontend:${IMAGE_TAG:-latest}
    container_name: iformat-frontend-prod
    restart: always
    build:
      context: ./iformat
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.iformatbranding.com/api/v1}
        NEXT_PUBLIC_USE_MOCK: "false"
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      # Localhost only: public traffic must go through host nginx (SSL)
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - iformat-internal

networks:
  iformat-internal:
    driver: bridge

