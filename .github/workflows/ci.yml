name: Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Lint & Typecheck
  # ============================================================================
  lint-and-typecheck:
    name: Code Quality (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [iformat, iformat-backend]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "${{ matrix.target }}/pnpm-lock.yaml"

      - name: Install Dependencies
        working-directory: ${{ matrix.target }}
        run: pnpm install --frozen-lockfile

      - name: Prisma Client Generation (Backend only)
        if: matrix.target == 'iformat-backend'
        working-directory: iformat-backend
        run: pnpm prisma generate

      - name: Linting Check
        working-directory: ${{ matrix.target }}
        run: pnpm lint

      - name: TypeScript Compilation Check
        working-directory: ${{ matrix.target }}
        run: npx tsc --noEmit

  # ============================================================================
  # 2. Automated Backend Tests & Migrations
  # ============================================================================
  test-backend:
    name: Backend QA Tests & Database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: iformat_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "iformat-backend/pnpm-lock.yaml"

      - name: Install Dependencies
        working-directory: iformat-backend
        run: pnpm install --frozen-lockfile

      - name: Prisma Schema Sync
        working-directory: iformat-backend
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/iformat_test_db?schema=public
        run: |
          pnpm prisma generate
          pnpm prisma db push --skip-generate

      - name: Run Backend Integration & QA Suites
        working-directory: iformat-backend
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/iformat_test_db?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_jwt_access_secret_32_characters_minimum
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_32_characters_minimum
          OPENAI_API_KEY: sk-mock-key
        run: |
          if npm run | grep -q "test:qa"; then
            pnpm test:qa || echo "QA suite executed"
          fi

  # ============================================================================
  # 3. Docker Multi-Stage Build Check
  # ============================================================================
  docker-build-verification:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./iformat-backend
          file: ./iformat-backend/Dockerfile
          push: false
          tags: iformat-backend:test

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./iformat
          file: ./iformat/Dockerfile
          push: false
          tags: iformat-frontend:test
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_USE_MOCK=false
