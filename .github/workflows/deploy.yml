name: Continuous Deployment (CD)

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # 0. Typecheck (blocks broken code from reaching production)
  # ============================================================================
  verify:
    name: Typecheck (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [iformat, iformat-backend]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "${{ matrix.target }}/pnpm-lock.yaml"

      - name: Install Dependencies
        working-directory: ${{ matrix.target }}
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Prisma Client Generation (Backend only)
        if: matrix.target == 'iformat-backend'
        working-directory: iformat-backend
        run: ./node_modules/.bin/prisma generate

      - name: TypeScript Compilation Check
        working-directory: ${{ matrix.target }}
        run: ./node_modules/.bin/tsc --noEmit

  # ============================================================================
  # 1. Build & Push Container Images to GHCR (Parallelized High-Speed Matrix)
  # ============================================================================
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./iformat-backend
            dockerfile: ./iformat-backend/Dockerfile
            build-args: ""
          - service: frontend
            context: ./iformat
            dockerfile: ./iformat/Dockerfile
            build-args: |
              NEXT_PUBLIC_API_URL=https://api.iformatbranding.com/api/v1
              NEXT_PUBLIC_USE_MOCK=false

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Lowercase Image Name
        id: repo
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${LOWER_REPO}/${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ============================================================================
  # 2. Automated Zero-Downtime Deployment to Server
  # ============================================================================
  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DOTENV_CONTENT: ${{ secrets.DOTENV_PRODUCTION }}
      # Deploy the exact images built for this commit (enables rollback by tag)
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 1: Copy docker-compose and nginx definitions directly to the server
      - name: Copy Deployment Files to Server
        if: env.DEPLOY_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          source: "docker-compose.prod.yml,nginx"
          target: "iformat"

      # Step 2: Automated SSH Deployment execution
      - name: Execute Remote Deployment via SSH
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          envs: DOTENV_CONTENT,IMAGE_TAG
          script: |
            set -e
            echo "🚀 Starting Automated Deployment to $(hostname)..."

            # Navigate to deployment directory
            cd $HOME/iformat

            # Automatically inject .env from GitHub Secrets if provided
            if [ -n "$DOTENV_CONTENT" ]; then
              echo "🔒 Injecting production environment variables from GitHub Secrets..."
              printf "%s\n" "$DOTENV_CONTENT" > .env
              chmod 600 .env
            fi

            # Authenticate to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Short SHA tag, matching docker/metadata-action (type=sha,format=short)
            export IMAGE_TAG="$(echo "$IMAGE_TAG" | cut -c1-11)"
            echo "📦 Deploying image tag: $IMAGE_TAG"

            # Pull new images first: if this fails, the running containers are untouched
            docker compose -f docker-compose.prod.yml pull backend frontend

            # Recreate containers and wait until healthchecks pass (fails the job if unhealthy).
            # Older Compose versions without --wait-timeout fall back to a plain `up -d`.
            if docker compose up --help | grep -q -- "--wait-timeout"; then
              docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180
            else
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
            fi

            # Remember deployed tags for quick rollback:
            #   IMAGE_TAG=<previous tag> docker compose -f docker-compose.prod.yml up -d --wait
            echo "$(date -u +%FT%TZ) $IMAGE_TAG" >> deploy-history.log

            # Free disk space AFTER a successful deploy. Keeps images from the last 7 days
            # (for rollback) and does not touch other projects' stopped containers/volumes.
            echo "🧹 Removing unused images older than 7 days..."
            docker image prune -af --filter "until=168h" || true

            echo "✅ Deployment completed successfully!"

      # Optional Webhook deploy fallback (for Coolify, Portainer, CapRover)
      - name: Trigger Webhook Deployment (Optional)
        if: env.DEPLOY_WEBHOOK_URL != ''
        run: |
          curl -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" -H "Content-Type: application/json"
