name: Continuous Deployment (CD)

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_GATEWAY: ghcr.io/${{ github.repository }}/gateway

jobs:
  # ============================================================================
  # 1. Build & Push Container Images to GHCR (Parallelized High-Speed Matrix)
  # ============================================================================
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./iformat-backend
            dockerfile: ./iformat-backend/Dockerfile
            image: ghcr.io/${{ github.repository }}/backend
            build-args: ""
          - service: frontend
            context: ./iformat
            dockerfile: ./iformat/Dockerfile
            image: ghcr.io/${{ github.repository }}/frontend
            build-args: |
              NEXT_PUBLIC_API_URL=/api/v1
              NEXT_PUBLIC_USE_MOCK=false
          - service: gateway
            context: ./nginx
            dockerfile: ./nginx/Dockerfile
            image: ghcr.io/${{ github.repository }}/gateway
            build-args: ""

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ============================================================================
  # 2. Automated Zero-Downtime Deployment to Server
  # ============================================================================
  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 1: Copy docker-compose and nginx definitions directly to the server
      - name: Copy Deployment Files to Server
        if: env.DEPLOY_SSH_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.prod.yml,nginx"
          target: "iformat"

      # Step 2: Automated SSH Deployment execution
      - name: Execute Remote Deployment via SSH
        if: env.DEPLOY_SSH_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          DOTENV_CONTENT: ${{ secrets.DOTENV_PRODUCTION }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DOTENV_CONTENT
          script: |
            set -e
            echo "🚀 Starting Automated Deployment to $(hostname)..."

            # Navigate to deployment directory
            cd $HOME/iformat

            # Automatically inject .env from GitHub Secrets if provided
            if [ -n "$DOTENV_CONTENT" ]; then
              echo "🔒 Injecting production environment variables from GitHub Secrets..."
              printf "%s\n" "$DOTENV_CONTENT" > .env
              chmod 600 .env
            fi

            # Authenticate to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Free up server disk space before pulling new layers
            echo "🧹 Freeing up server disk space (cleaning old images & dangling caches)..."
            docker system prune -af || true
            docker builder prune -af || true

            # Pull new container images
            docker compose -f docker-compose.prod.yml pull

            # Execute rolling container update
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "✅ Deployment completed successfully with zero manual server editing!"

      # Optional Webhook deploy fallback (for Coolify, Portainer, CapRover)
      - name: Trigger Webhook Deployment (Optional)
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" -H "Content-Type: application/json"
