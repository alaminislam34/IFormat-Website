services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: iformat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-iformat_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iformat_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iformat-network

  # ============================================================================
  # Redis Cache & Rate Limiting Service
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: iformat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iformat-network

  # ============================================================================
  # Backend Service (Express + Prisma + TypeScript)
  # ============================================================================
  backend:
    build:
      context: ./iformat-backend
      dockerfile: Dockerfile
    container_name: iformat-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      API_VERSION: v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-iformat_db}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local_dev_jwt_access_secret_32_characters_minimum}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_dev_jwt_refresh_secret_32_characters_minimum}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://18.185.68.217:8010}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-60000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-mock-key}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - iformat-network

  # ============================================================================
  # Frontend Service (Next.js 16 Standalone)
  # ============================================================================
  frontend:
    build:
      context: ./iformat
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
        NEXT_PUBLIC_USE_MOCK: "false"
    container_name: iformat-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - iformat-network

networks:
  iformat-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
